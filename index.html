    <script>
      (function() {
        try {
          // Fix for "Cannot set property fetch of #<Window> which has only a getter"
          var nativeFetch = window.fetch;
          var activeFetch = nativeFetch ? nativeFetch.bind(window) : undefined;

          // Patch on Window.prototype if accessor has no setter
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = typeof fn === 'function' ? fn : nativeFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          }

          // Define own property on window with both getter and setter
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = typeof fn === 'function' ? fn : nativeFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
